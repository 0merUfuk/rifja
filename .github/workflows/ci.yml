name: Local continuity checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv sync --locked --python python
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python tools/verify_install.py --wheel dist/session_visualizer-0.1.0rc1-py3-none-any.whl --evidence .local/ci-install
