name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.10.10
      - run: uv sync --locked --python python
      - run: make check
      - run: make dist
      - run: uv run python tools/verify_install.py --wheel dist/session_visualizer-$(uv run python -c 'import session_visualizer; print(session_visualizer.__version__)')-py3-none-any.whl --evidence .local/ci-install
      - run: uv run python tools/audit_release.py --output .local/ci-audit.json
      - name: Homebrew installation lifecycle
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          ./install.sh
          session-visualizer --version
          brew test session-visualizer/local/session-visualizer
          ./install.sh --reinstall
          brew uninstall session-visualizer/local/session-visualizer
          ./install.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            .local/ci-install/report.json
            .local/ci-audit.json
          include-hidden-files: true
          retention-days: 14
