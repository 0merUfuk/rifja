[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "session-visualizer"
version = "0.1.0rc2"
description = "Offline, evidence-aware engineering continuity for local agent sessions and Git"
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-Private-Local-Use"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
session-visualizer = "session_visualizer.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/session_visualizer"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "tools/", ".github/", ".gitignore", "README.md", "NOTICE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
files = ["src/session_visualizer"]
