[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "rifja"
version = "0.3.0"
description = "Offline, evidence-aware engineering continuity for local agent sessions and Git"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/0merUfuk/rifja"
Repository = "https://github.com/0merUfuk/rifja"
Documentation = "https://github.com/0merUfuk/rifja/blob/main/docs/usage.md"
Issues = "https://github.com/0merUfuk/rifja/issues"
Changelog = "https://github.com/0merUfuk/rifja/blob/main/docs/releases.md"

[project.scripts]
rifja = "rifja.cli:main"
session-visualizer = "rifja.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<3", "build>=1.2,<2", "hatchling==1.32.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rifja", "src/session_visualizer"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "tools/", "packaging/", "install.sh", "Makefile", ".github/", ".gitignore", "README.md", "NOTICE", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
files = ["src/rifja"]
